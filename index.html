<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Latino Built Pro Source — Floor Plan Tool</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--brand:#6B2D0F;--brand-mid:#8B3A12;--brand-light:#A0522D;--accent:#E87A2A;--bg:#F7F3EF;--surface:#fff;--border:#E8DDD4;--text:#1C1209}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column;overflow:hidden}.probar{height:68px;flex:0 0 68px;background:linear-gradient(135deg,var(--brand),var(--brand-mid) 60%,var(--brand-light));color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:10}.mark{width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-family:'DM Mono',monospace;letter-spacing:-.06em}.brand{min-width:0}.eyebrow{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;opacity:.72}.title{font-size:.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{margin-left:auto;display:flex;align-items:center;gap:8px}.badge,.save{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;font-size:.68rem;font-weight:700;white-space:nowrap}.save{font-family:'DM Mono',monospace;font-weight:500}.save.ok{background:rgba(255,255,255,.2)}.frame{position:relative;flex:1;min-height:0;background:#fff}.frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}.watermark{position:absolute;right:14px;bottom:12px;z-index:5;pointer-events:none;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:.62rem;font-weight:500;color:var(--brand);box-shadow:0 2px 8px rgba(107,45,15,.08)}@media(max-width:700px){.probar{height:60px;flex-basis:60px;padding:0 10px;gap:9px}.mark{width:34px;height:34px;border-radius:9px}.title{font-size:.82rem}.eyebrow{font-size:.55rem}.badge{display:none}.save{font-size:.55rem;padding:5px 7px}.watermark{right:8px;bottom:8px;font-size:.54rem;padding:5px 8px}}</style></head><body><header class="probar"><div class="mark">LB</div><div class="brand"><div class="eyebrow">Latino Built · Pro Source</div><div class="title">Floor Plan Tool</div></div><div class="right"><div class="save" id="saveState">Plan stays on this device</div><div class="badge">Free contractor tool</div></div></header><main class="frame"><iframe id="tool" src="tool.html" title="Floor Plan Tool"></iframe><div class="watermark">A contractor resource from Latino Built</div></main><script>const frame=document.getElementById('tool'),stateEl=document.getElementById('saveState');frame.addEventListener('load',()=>{const doc=frame.contentDocument;const s=doc.createElement('script');s.textContent=`(()=>{const KEY='latino-built-floor-plan-draft-v1';let saveTimer;function notify(msg){try{parent.postMessage({type:'lb-floor-save',msg},'*')}catch(e){}}function saveLB(){try{const project=document.getElementById('proj-input')?.value||'';localStorage.setItem(KEY,JSON.stringify({floors,curFloor,view,project,savedAt:Date.now()}));notify('Saved on this device')}catch(e){}}function queueLB(){clearTimeout(saveTimer);saveTimer=setTimeout(saveLB,250)}try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.floors)&&saved.floors.length){floors=saved.floors;curFloor=Math.max(0,Math.min(saved.curFloor||0,floors.length-1));if(saved.view)view=saved.view;const p=document.getElementById('proj-input');if(p)p.value=saved.project||'';selected=null;render();updateRoomList();notify('Plan restored from this device')}}catch(e){}['pointerup','touchend','change','input','click'].forEach(ev=>document.addEventListener(ev,queueLB,true));window.addEventListener('beforeunload',saveLB)})();`;doc.body.appendChild(s)});window.addEventListener('message',e=>{if(!e.data||e.data.type!=='lb-floor-save')return;stateEl.textContent=e.data.msg;stateEl.classList.add('ok');clearTimeout(window.__floorMsg);window.__floorMsg=setTimeout(()=>{stateEl.textContent='Plan stays on this device';stateEl.classList.remove('ok')},1900)});</script></body></html>
